spring.application.name=election-ai
server.port=8080

form20.source-url=https://www.elections.tn.gov.in/Form20_TNLA2026.aspx
form20.timeout-millis=30000

# Official list of contesting candidates (Form 7A) - source of party names
form7a.list-url=https://erolls.tn.gov.in/acwithcandidate_tnla2026/AC_List.aspx

# Official list of polling stations (building and polling areas per station), one PDF per constituency
pslist.page-url=https://www.elections.tn.gov.in/PSLIST_06042026.aspx

# Visitor statistics (/stats). Stored in Firestore; the secrets come from Secret Manager on Cloud Run.
analytics.enabled=${ANALYTICS_ENABLED:true}
analytics.salt=${ANALYTICS_SALT:}
analytics.stats-user=admin
analytics.stats-password=${STATS_PASSWORD:}
analytics.geoip-db=${GEOIP_DB:/opt/geoip/dbip-city-lite.mmdb}
analytics.retention-days=180
# Firestore is called over REST. On Cloud Run the project and login come from the metadata server;
# to test locally set GOOGLE_CLOUD_PROJECT and ANALYTICS_ACCESS_TOKEN (gcloud auth print-access-token).
analytics.project-id=${GOOGLE_CLOUD_PROJECT:}
analytics.access-token=${ANALYTICS_ACCESS_TOKEN:}

# Behind the Kong gateway: send redirects as relative paths so the browser stays on the gateway's host
server.tomcat.use-relative-redirects=true
