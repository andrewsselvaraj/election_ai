<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TN Assembly 2026 – Form 20 Constituencies</title>
    <style>
        :root {
            --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #5f6b7a;
            --line: #e2e6eb; --accent: #0b6e4f; --accent-soft: #e6f3ee; --sc: #8a4b00; --sc-bg: #fff2df;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #12151a; --card: #1b2028; --text: #e6e9ee; --muted: #9aa5b3;
                --line: #2c333d; --accent: #4cc39a; --accent-soft: #17332a; --sc: #f0b46a; --sc-bg: #3a2a14;
            }
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
               background: var(--bg); color: var(--text); line-height: 1.45; }
        header { padding: 24px 16px 8px; max-width: 1200px; margin: 0 auto; }
        h1 { margin: 0 0 4px; font-size: 1.5rem; }
        .meta { color: var(--muted); font-size: .875rem; }
        .meta a { color: var(--accent); }
        .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
                   max-width: 1200px; margin: 12px auto; padding: 0 16px; }
        .toolbar input[type=search] { flex: 1 1 260px; padding: 9px 12px; border: 1px solid var(--line);
                   border-radius: 8px; background: var(--card); color: var(--text); font-size: 1rem; }
        button { padding: 9px 14px; border-radius: 8px; border: 1px solid var(--accent);
                 background: var(--accent); color: #fff; font-size: .95rem; cursor: pointer; }
        button.secondary { background: transparent; color: var(--accent); }
        .stats { display: flex; gap: 12px; flex-wrap: wrap; max-width: 1200px; margin: 0 auto; padding: 0 16px; }
        .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
        .stat b { display: block; font-size: 1.4rem; }
        .stat span { color: var(--muted); font-size: .8rem; }
        main { max-width: 1200px; margin: 16px auto 40px; padding: 0 16px;
               display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
        .district { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
        .district h2 { margin: 0; padding: 10px 14px; font-size: 1rem; background: var(--accent-soft);
                       display: flex; justify-content: space-between; gap: 8px; }
        .district h2 small { color: var(--muted); font-weight: 500; }
        ul { list-style: none; margin: 0; padding: 0; }
        li { display: flex; align-items: center; gap: 10px; padding: 7px 14px; border-top: 1px solid var(--line); }
        .no { min-width: 2.6em; font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; }
        .name { flex: 1; }
        .tag { font-size: .7rem; font-weight: 600; padding: 1px 6px; border-radius: 4px;
               color: var(--sc); background: var(--sc-bg); }
        li a { color: var(--accent); font-size: .85rem; text-decoration: none; white-space: nowrap; }
        li a:hover { text-decoration: underline; }
        .empty { grid-column: 1 / -1; color: var(--muted); text-align: center; padding: 40px 0; }
    </style>
</head>
<body>
<header>
    <h1>Tamil Nadu Legislative Assembly Election 2026 – Form 20</h1>
    <div class="meta">
        Source: <a th:href="${source.startsWith('http') ? source : 'https://www.elections.tn.gov.in/Form20_TNLA2026.aspx'}"
                   th:text="${source}" target="_blank" rel="noopener">source</a>
        · loaded <span th:text="${loadedAt}">now</span>
    </div>
</header>

<div class="stats">
    <div class="stat"><b th:text="${total}">234</b><span>Constituencies</span></div>
    <div class="stat"><b th:text="${districtCount}">38</b><span>Districts</span></div>
    <div class="stat" th:if="${!q.isEmpty()}"><b th:text="${shown}">0</b><span>Matching “<span th:text="${q}"></span>”</span></div>
</div>

<div class="toolbar">
    <form method="get" th:action="@{/}" style="display:flex;gap:8px;flex:1 1 400px;flex-wrap:wrap">
        <input type="search" name="q" th:value="${q}" placeholder="Search by constituency, district or AC number">
        <button type="submit">Search</button>
        <a th:if="${!q.isEmpty()}" th:href="@{/}"><button type="button" class="secondary">Clear</button></a>
    </form>
    <form method="post" th:action="@{/refresh}">
        <button type="submit" class="secondary" title="Re-fetch from elections.tn.gov.in">Refresh from site</button>
    </form>
</div>

<main>
    <section class="district" th:each="d : ${districts}">
        <h2>
            <span th:text="${d.number() + '. ' + d.name()}">1. TIRUVALLUR</span>
            <small th:text="${d.constituencies().size() + ' AC'}">10 AC</small>
        </h2>
        <ul>
            <li th:each="c : ${d.constituencies()}">
                <span class="no" th:text="${c.number()}">1</span>
                <span class="name" th:text="${c.name()}">Gummidipoondi</span>
                <span class="tag" th:if="${c.reservation() != null}" th:text="${c.reservation()}">SC</span>
                <a th:href="@{/constituency/{ac}(ac=${c.number()})}"
                   title="Load polling-station votes from the Form 20 PDF">Form 20 PDF</a>
                <a th:href="${c.form20PdfUrl()}" target="_blank" rel="noopener" title="Open the original PDF">↗</a>
            </li>
        </ul>
    </section>
    <p class="empty" th:if="${districts.isEmpty()}">No constituencies match your search.</p>
</main>
</body>
</html>
